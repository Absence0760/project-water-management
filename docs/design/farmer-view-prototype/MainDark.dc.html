<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>My farm, dark mode</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&amp;display=swap">
<style>body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:#121312}</style>
</helmet>
<div style="width: 360px; height: 2160px; background: #121312">
<dc-import name="Main" dark="{{yes}}" notice="advisory" hint-size="360px,2160px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":2160}}'>
class Component extends DCLogic {
  renderVals() { return { yes: true }; }
}
</script>
</body>
</html>
