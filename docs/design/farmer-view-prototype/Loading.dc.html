<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loading your farm</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</helmet>
<div style="width: 360px; height: 760px; box-sizing: border-box; background: #f3f5f9; color: #161816; font-size: 16px; line-height: 1.45; display: flex; flex-direction: column">
<header style="height: 56px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; background: #fdfdfe; border-bottom: 1px solid #d9dcd9">
<span style="font-weight: 600; font-size: 17px">My farm</span>
</header>
<main aria-busy="true" style="padding: 16px; display: flex; flex-direction: column; gap: 12px">
<p role="status" class="vh">Loading your farm…</p>
<div aria-hidden="true" style="display: flex; flex-direction: column; gap: 8px">
<div style="width: 70%; height: 28px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 45%; height: 16px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 90%; height: 14px; border-radius: 4px; background: #eaecea"></div>
</div>
<div aria-hidden="true" style="height: 168px; border-radius: 8px; background: #fdfdfe; border: 1px solid #d9dcd9; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="width: 55%; height: 18px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 100%; height: 14px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 85%; height: 14px; border-radius: 4px; background: #eaecea"></div>
</div>
<div aria-hidden="true" style="height: 190px; border-radius: 8px; background: #fdfdfe; border: 1px solid #d9dcd9; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="width: 65%; height: 18px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 30%; height: 40px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 100%; height: 12px; border-radius: 6px; background: #eaecea"></div>
</div>
<div aria-hidden="true" style="height: 190px; border-radius: 8px; background: #fdfdfe; border: 1px solid #d9dcd9; padding: 16px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px">
<div style="width: 40%; height: 18px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 30%; height: 40px; border-radius: 4px; background: #eaecea"></div>
<div style="width: 100%; height: 16px; border-radius: 6px; background: #eaecea"></div>
</div>
<p style="margin: 0; text-align: center; font-size: 14px; color: #666a66">Slow signal? This can take a moment.</p>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":360,"height":760}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
