<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Until a page sets its own (the loading and "could not reach the API" states have none otherwise). -->
		<title>Water Management</title>
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="48x48" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
		<link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />
		<link rel="preload" href="%sveltekit.assets%/fonts/outfit-600.woff2" as="font" type="font/woff2" crossorigin />
		<meta name="theme-color" content="#102a43" />
		<meta name="color-scheme" content="light dark" />
		<!-- Page background before app.css loads (no white flash on reload in dark mode); matches --bg. -->
		<style>
			html { background: #f3f5f9; }
			@media (prefers-color-scheme: dark) { html { background: #121312; } }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
