<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts the e2e browser sees: these four DejaVu files and nothing from the
  system (no <include> of the system config). Playwright points Chromium at this
  file (FONTCONFIG_FILE, playwright.config.ts), so a laptop lays text out exactly
  as CI does. Without it the body text (system-ui) was Noto Sans on a Fedora
  laptop and DejaVu Sans on the Ubuntu runner, which sets text wider: layout
  checks ("one row", "the page doesn't scroll") passed locally and failed in CI
  (issue #162). DejaVu is what Ubuntu's fonts-dejavu-core installs; italics are
  synthesized there too. Body text is now the self-hosted Inter and the display
  face Outfit, both web fonts and unaffected: this pins monospace and any
  fallback. macOS Chromium doesn't read fontconfig.
-->
<fontconfig>
	<dir prefix="relative">.</dir>
	<cachedir prefix="xdg">water-management-e2e-fonts</cachedir>
	<alias binding="same">
		<family>system-ui</family>
		<prefer><family>DejaVu Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>sans-serif</family>
		<prefer><family>DejaVu Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>serif</family>
		<prefer><family>DejaVu Sans</family></prefer>
	</alias>
	<alias binding="same">
		<family>monospace</family>
		<prefer><family>DejaVu Sans Mono</family></prefer>
	</alias>
</fontconfig>
