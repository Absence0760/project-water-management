packages:
  - frontend
  - backend
  - packages/*
  - e2e

# Supply-chain delay: pnpm refuses to resolve a registry version published
# less than 7 days ago (10080 minutes; pnpm >= 10.16, packageManager pins
# 10.33.2). Most malicious releases are caught and unpublished within days.
# Matches the 7-day Dependabot cooldown (.github/dependabot.yml). It applies
# when pnpm resolves (a new dependency, `pnpm update`, a lockfile refresh);
# `--frozen-lockfile` installs only what the lockfile already names. If a
# fix can't wait a week, name that version under minimumReleaseAgeExclude
# with a comment and remove it once the week has passed.
minimumReleaseAge: 10080
minimumReleaseAgeExclude: []

# Local patches for advisories with no fixed release. Each names its advisory
# and has a guard test; drop the patch (and its osv-scanner.toml entry) once
# upstream ships a fix.
# deepmerge 4.3.1 (the last release, via @sveltejs/vite-plugin-svelte):
# GHSA-gcqx-w48m-w2h4, a "__proto__" key set the merged object's prototype.
# Guard: frontend/src/lib/deepmergePatch.security.test.ts.
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
