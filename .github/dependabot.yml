version: 2

# Every ecosystem waits 7 days after a release before proposing it
# (`cooldown`; security updates are exempt and still arrive at once).
# Most malicious package releases are found and pulled within days, and
# pnpm-workspace.yaml's minimumReleaseAge holds installs to the same week.
updates:
  # GitHub Actions used in workflows.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]

  # Adjust or duplicate these per template's actual ecosystems.
  # Each template branch should leave the ones it needs and remove the rest.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      # backend's playwright-core and e2e's @playwright/test in one PR: the
      # Chromium build is tied to the version. The renderer image's pins
      # (renderer-deps, the Dockerfile's tag and digest) move by hand in that
      # PR; until they do, `pnpm check:pins` fails it
      # (scripts/guards/check_playwright_pins.mjs). Listed before
      # minor-and-patch so it takes these two.
      playwright:
        patterns: ["playwright-core", "@playwright/test"]
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks Node's major, and the runtime is Node 24
      # (.tool-versions, Lambda nodejs24.x): 25+ types describe APIs Node 24
      # lacks. Lift this with the runtime.
      - dependency-name: "@types/node"
        versions: [">=25"]
      # The frontend stays on TypeScript 6: svelte-check and @sveltejs/kit
      # accept typescript ^5 || ^6 only, and TypeScript 7 (the native port)
      # ships no JS compiler API, which svelte-check and two frontend guard
      # tests (engineSideEffects, engineSplit) import. backend, engine and e2e
      # run 7 (tsc only). Majors are ignored for every workspace (one npm
      # entry covers them all), so bump TypeScript majors by hand.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # The report renderer image's npm packages (backend/renderer.Dockerfile
  # installs them with npm ci from this lockfile). playwright-core moves by
  # hand, together with the image tag and digest and backend's playwright-core
  # (the Dockerfile's header says how), so it is ignored here. Never
  # auto-merged: what goes into the renderer image gets a human review
  # (dependabot-auto-merge.yml excludes this directory, and
  # `pnpm check:workflows`, auto-merge rule, keeps it excluded).
  - package-ecosystem: npm
    directory: "/backend/renderer-deps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "playwright-core"

  # The report renderer's base image (backend/renderer.Dockerfile, both FROM
  # lines: mcr.microsoft.com/playwright:v<version>-noble@sha256:…). Dependabot
  # moves the tag and digest together. A new Playwright version must also move
  # renderer-deps, backend's playwright-core and e2e's @playwright/test, and
  # `pnpm check:pins` fails the PR until it does. Every one of these PRs,
  # digest-only bumps (the same tag rebuilt) included, also moves the build
  # stage's apt snapshot and versions against the new base: run
  # `pnpm gen:renderer-apt` on the PR's branch (the Dockerfile's header says
  # why). Never auto-merged: `docker` is left out of
  # dependabot-auto-merge.yml's allowlist, and `pnpm check:workflows`
  # (auto-merge rule) keeps it out.
  - package-ecosystem: docker
    directory: "/backend"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2

  # The repo's Python lives in subfolders, each with its own pinned
  # requirements.txt; "/" has none, so list the folders (a new Python tool
  # adds its folder here). verify/ is stdlib-only, so it has none to list.
  - package-ecosystem: pip
    directories:
      - "/brand"
      - "/scripts/wbt-import"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # The local-dev services (docker-compose.yml; CI starts MinIO and Mailpit
  # from it). A MinIO bump is the moment to re-check the community fork
  # (pgsty/minio; upstream stopped publishing images, docs/followups.md
  # § Server-side reports): still maintained, still S3-compatible for the
  # report tests. Postgres majors are ignored: production runs RDS Postgres
  # 17 (infra/), and local dev and CI stay on the same major.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: terraform
    directory: "/infra"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
