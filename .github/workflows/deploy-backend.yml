name: Deploy backend

## TODO: Uncomment triggers when ready to deploy.
# on:
#   release:
#     types: [published]
#   workflow_dispatch:
on: workflow_dispatch

concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to deploy backend
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            echo "Triggered by workflow_dispatch — deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current release tag: $CURRENT_TAG"

          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName \
            --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" \
            | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — deploying (first release)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous release tag: $PREV_TAG"
          git fetch --tags --quiet

          CHANGED=$(git diff --name-only "$PREV_TAG..$CURRENT_TAG" -- \
            'backend/' \
            'packages/engine/' \
            'infra/scripts/package-lambdas.sh' \
            'infra/certs/' \
            'pnpm-lock.yaml' \
            '.github/workflows/deploy-backend.yml' \
            || true)

          if [[ -n "$CHANGED" ]]; then
            echo "Backend files changed since $PREV_TAG:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No backend files changed between $PREV_TAG and $CURRENT_TAG — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: backend
        run: pnpm check

      # Builds backend/dist/lambda.zip (API) and backend/dist/migrate.zip
      # (migrations + owner-role runner). Layouts documented in the script.
      - name: Build and package Lambdas
        run: infra/scripts/package-lambdas.sh

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-backend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Migrations run BEFORE the new API code ships, so they must stay
      # backwards-compatible with the code still serving for that window
      # (expand/contract — CLAUDE.md rule 2).
      - name: Update migrate Lambda code
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --zip-file "fileb://backend/dist/migrate.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$MIGRATE_FUNCTION_NAME"

      - name: Run migrations
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          # Synchronous invoke; the function's own timeout is 300 s.
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --cli-read-timeout 320 \
            --log-type Tail \
            migrate-result.json > migrate-meta.json
          # Tail of the function's log (migration names only — no credentials).
          jq -r '.LogResult // empty' migrate-meta.json | base64 -d || true
          echo "Result: $(cat migrate-result.json)"
          if jq -e 'has("FunctionError")' migrate-meta.json > /dev/null; then
            echo "::error::Migrate Lambda failed — API code NOT updated."
            exit 1
          fi

      - name: Update API Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file "fileb://backend/dist/lambda.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"
