name: Deploy backend

# Release-triggered, estate model (threkir release-backend.yml / release-web.yml,
# feohledger aws-deploy.yml): publishing a GitHub Release whose tag is
# `backend@X.Y.Z` deploys the API + migrations to production. A bare tag push
# does nothing; the published Release is the deploy trigger, so its notes are
# written up front and the deploy is a deliberate act:
#
#   gh release create backend@0.2.0 --target main --generate-notes
#
# Four jobs, each with only the scope it needs:
#
#   preflight  no environment, no AWS. scripts/release/preflight.mjs refuses
#              the release unless the tag is backend@semver and newer than the
#              last backend release, the commit is on main with a green
#              `CI gate`, the `production` environment exists WITH a required
#              reviewer, and every AWS variable/secret is set. Until the AWS
#              account is bootstrapped, this is where a release stops, with a
#              pointer to infra/README.md § Operator steps.
#   build      no environment, no AWS. Installs deps and packages both Lambda
#              zips. Third-party npm code never runs in a job that holds AWS
#              credentials.
#   deploy     `environment: production`: GitHub pauses for the required
#              reviewer, and only then can the OIDC token carry the
#              `environment:production` subject the deploy role trusts.
#              Migrations run BEFORE the API code is updated (expand/contract,
#              CLAUDE.md rule 2), then a /api/health smoke check.
#   attach     `contents: write` only: attaches both zips to the Release, so
#              the exact artifact that shipped is kept with its notes.
#
# Rollback / redeploy: run it manually with an older published tag
#   gh workflow run deploy-backend.yml -f tag=backend@0.1.0
# which goes through the same preflight and approval. Migrations are
# forward-only, so a rollback ships old API code against the current schema;
# expand/contract is what keeps that safe.
#
# No static AWS keys anywhere: AWS_DEPLOY_ROLE_ARN is assumed via OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published backend@X.Y.Z release to deploy (an older tag rolls back)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  preflight:
    name: Preflight (tag, main, CI, environment, AWS config)
    # `on: release` fires for every published release; only backend@ ones matter.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'backend@')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # read the production environment's protection rules
      checks: read # read `CI gate` on the tagged commit
    outputs:
      deploy: ${{ steps.preflight.outputs.deploy }}
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Checkout (full history + tags, to check the tag is on main)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CONFIG: AWS_DEPLOY_ROLE_ARN,AWS_REGION,LAMBDA_FUNCTION_NAME,MIGRATE_FUNCTION_NAME,PUBLIC_SITE_URL
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/release/preflight.mjs backend

  build:
    name: Build Lambda packages
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm -C backend check

      # backend/dist/lambda.zip (API) + backend/dist/migrate.zip (migrations +
      # owner-role runner). Layouts documented in the script.
      - name: Build and package Lambdas
        run: infra/scripts/package-lambdas.sh

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-lambdas
          path: |
            backend/dist/lambda.zip
            backend/dist/migrate.zip
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy (migrate, then API)
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The approval gate. The deploy role's trust policy pins the
    # `environment:production` subject, so OIDC only works after approval.
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    permissions:
      contents: read
      id-token: write # OIDC: assume AWS_DEPLOY_ROLE_ARN, no long-lived keys
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-lambdas
          path: dist

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-backend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Migrations run BEFORE the new API code ships, so they must stay
      # backwards-compatible with the code still serving for that window
      # (expand/contract — CLAUDE.md rule 2).
      - name: Update migrate Lambda code
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --zip-file "fileb://dist/migrate.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$MIGRATE_FUNCTION_NAME"

      - name: Run migrations
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          # Synchronous invoke; the function's own timeout is 300 s.
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --cli-read-timeout 320 \
            --log-type Tail \
            migrate-result.json > migrate-meta.json
          # Tail of the function's log (migration names only — no credentials).
          jq -r '.LogResult // empty' migrate-meta.json | base64 -d || true
          echo "Result: $(cat migrate-result.json)"
          if jq -e 'has("FunctionError")' migrate-meta.json > /dev/null; then
            echo "::error::Migrate Lambda failed — API code NOT updated."
            exit 1
          fi

      - name: Update API Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file "fileb://dist/lambda.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      # Through CloudFront, the same path a browser takes (/api/* is proxied
      # with the shared-secret header; a direct Function URL hit is a 403).
      - name: Smoke check /api/health
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 "${SITE%/}/api/health")
          echo "$body"
          if ! jq -e '.ok == true' <<<"$body" > /dev/null; then
            echo "::error::/api/health did not answer {\"ok\":true} after the deploy."
            exit 1
          fi

  attach:
    name: Attach packages to the Release
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets; nothing else
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-lambdas
          path: dist

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mv dist/lambda.zip "dist/backend-${VERSION}-lambda.zip"
          mv dist/migrate.zip "dist/backend-${VERSION}-migrate.zip"
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
