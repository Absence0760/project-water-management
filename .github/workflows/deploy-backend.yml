name: Deploy backend

# Release-triggered, estate model (threkir release-backend.yml / release-web.yml,
# feohledger aws-deploy.yml): publishing a GitHub Release whose tag is
# `backend@X.Y.Z` deploys the API, migrations, job worker, feed fetcher and report renderer to production. A bare tag push
# does nothing; the published Release is the deploy trigger, so its notes are
# written up front and the deploy is a deliberate act:
#
#   gh release create backend@0.2.0 --target main --generate-notes
#
# Four jobs, each with only the scope it needs:
#
#   preflight  no environment, no AWS. scripts/release/preflight.mjs refuses
#              the release unless the tag is backend@semver and newer than the
#              last backend release, the commit is on main with a green
#              `CI gate` (from ci.yml, under GitHub Actions), the `production`
#              environment exists WITH a required reviewer and deploys only
#              from main and the release tags, a tag ruleset protects
#              backend@*/web@*, and every AWS variable/secret is set. Until the AWS
#              account is bootstrapped, this is where a release stops, with a
#              pointer to infra/README.md § Operator steps.
#   build      no environment, no AWS. Installs deps and packages the four
#              Lambda zips (API, migrate, worker, fetcher), and builds the
#              report renderer's container image (backend/renderer.Dockerfile),
#              saved as an artifact. Third-party npm code never runs in a job
#              that holds AWS credentials.
#   deploy     `environment: production`: GitHub pauses for the required
#              reviewer, and only then can the OIDC token carry the
#              `environment:production` subject the deploy role trusts.
#              Migrations run BEFORE the API code is updated (expand/contract,
#              CLAUDE.md rule 2); the worker's code follows the API's, and
#              the fetcher's the worker's; then the renderer's image is
#              pushed to ECR as <version>-<sha12> and the renderer moved to
#              it (skipped, with a
#              notice, until the operator has created the function:
#              infra/reports.tf renderer_image_tag);
#              then a /api/health smoke check.
#   attach     `contents: write` only: attaches the zips to the Release, so
#              the exact artifact that shipped is kept with its notes.
#
# Rollback / redeploy: run it manually with an older published tag
#   gh workflow run deploy-backend.yml -f tag=backend@0.1.0
# which goes through the same preflight and approval. Migrations are
# forward-only, so a rollback ships old API code against the current schema;
# expand/contract is what keeps that safe.
#
# No static AWS keys anywhere: AWS_DEPLOY_ROLE_ARN is assumed via OIDC.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published backend@X.Y.Z release to deploy (an older tag rolls back)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  preflight:
    name: Preflight (tag, main, CI, environment, AWS config)
    # `on: release` fires for every published release; only backend@ ones matter.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'backend@')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # read the production environment's protection rules
      checks: read # read `CI gate` on the tagged commit
    outputs:
      deploy: ${{ steps.preflight.outputs.deploy }}
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Checkout (full history + tags, to check the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CONFIG: AWS_DEPLOY_ROLE_ARN,AWS_REGION,LAMBDA_FUNCTION_NAME,MIGRATE_FUNCTION_NAME,WORKER_FUNCTION_NAME,FETCHER_FUNCTION_NAME,RENDERER_FUNCTION_NAME,RENDERER_ECR_REPOSITORY,PUBLIC_SITE_URL
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
          WORKER_FUNCTION_NAME: ${{ vars.WORKER_FUNCTION_NAME }}
          FETCHER_FUNCTION_NAME: ${{ vars.FETCHER_FUNCTION_NAME }}
          RENDERER_FUNCTION_NAME: ${{ vars.RENDERER_FUNCTION_NAME }}
          RENDERER_ECR_REPOSITORY: ${{ vars.RENDERER_ECR_REPOSITORY }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/release/preflight.mjs backend

  build:
    name: Build Lambda packages
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a deploy: a restored cache is written by
          # other runs, and this job ships what it builds with production
          # credentials (CodeQL actions/cache-poisoning). Deploys are rare, so
          # a cold install costs a minute at most.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck backend
        run: pnpm -C backend check

      # backend/dist/lambda.zip (API) + backend/dist/migrate.zip (migrations +
      # owner-role runner) + backend/dist/worker.zip (background jobs) +
      # backend/dist/fetcher.zip (data feeds, outside the VPC).
      # Layouts documented in the script.
      - name: Build and package Lambdas
        run: infra/scripts/package-lambdas.sh

      # The report renderer (infra/reports.tf): a container image with
      # Playwright's Chromium around the bundle package-lambdas.sh wrote.
      # Built here, where there are no AWS credentials, and handed to the
      # deploy job as a docker archive.
      - name: Build the renderer image
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          # One linux/amd64 image manifest with no attestations: Lambda
          # refuses an OCI image index, which provenance/SBOM attestations
          # make of the push under Docker's containerd image store (the
          # default from Engine 29), and ECR's untagged-image expiry would
          # then delete the index's children. Same command as CI's
          # renderer-image job (bin/check-renderer-image.sh).
          docker buildx build --provenance=false --sbom=false --platform linux/amd64 --load \
            -f backend/renderer.Dockerfile -t "renderer:${VERSION}" backend
          # As Lambda runs it: Chromium prints, the handler answers under the
          # runtime interface emulator, the init check is live (CI's
          # renderer-image job runs the same on every PR).
          infra/scripts/smoke-renderer-image.sh "renderer:${VERSION}"
          docker save "renderer:${VERSION}" | gzip -1 > backend/dist/renderer-image.tar.gz
          du -h backend/dist/renderer-image.tar.gz

      - name: Upload the renderer image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: renderer-image
          path: backend/dist/renderer-image.tar.gz
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Upload packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-lambdas
          path: |
            backend/dist/lambda.zip
            backend/dist/migrate.zip
            backend/dist/worker.zip
            backend/dist/fetcher.zip
          if-no-files-found: error
          retention-days: 30

      # The bundles are minified; their source maps stay out of the packages
      # (package-lambdas.sh header) and are kept here to read a production
      # stack trace (docs/deployment.md § Lambda bundles). Built from this
      # public repo's code and open-source deps only, no config or secrets.
      - name: Upload source maps
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-sourcemaps
          path: backend/dist/sourcemaps/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy (migrate, then API, then worker and fetcher)
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The approval gate. The deploy role's trust policy pins the
    # `environment:production` subject, so OIDC only works after approval.
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    permissions:
      contents: read
      id-token: write # OIDC: assume AWS_DEPLOY_ROLE_ARN, no long-lived keys
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-lambdas
          path: dist

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-backend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Migrations run BEFORE the new API code ships, so they must stay
      # backwards-compatible with the code still serving for that window
      # (expand/contract — CLAUDE.md rule 2).
      - name: Update migrate Lambda code
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --zip-file "fileb://dist/migrate.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$MIGRATE_FUNCTION_NAME"

      - name: Run migrations
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          # The point-in-time restore target if a migration damages data
          # (docs/deployment.md § Restoring the database: restore-db.sh
          # --restore-time). No manual snapshot: PITR already reaches any
          # second in the retention window, and a manual snapshot would
          # outlive it (the privacy notice's backup period).
          echo "Restore point before these migrations (UTC): $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Synchronous invoke; the function's own timeout is 300 s. No
          # --log-type Tail: this log is public (the repo is), and the
          # function's log and error text can quote SQL or data. Only names
          # and codes are printed; the detail is in CloudWatch, which is not.
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            --cli-read-timeout 320 \
            migrate-result.json > migrate-meta.json
          # Each field is checked against the shape it must have (a migration
          # file name, a code, a log stream) and dropped if it doesn't match,
          # so nothing but what lambda-migrate.ts means to report can print.
          names='def names: [.[]? | strings | select(test("^[0-9]+_[A-Za-z0-9_.-]+[.]sql$"))] | if length == 0 then "none" else join(", ") end;
            def safe(re): if type == "string" and test(re) then . else "unknown" end;'
          if jq -e 'has("FunctionError")' migrate-meta.json > /dev/null; then
            # lambda-migrate.ts fails with a JSON summary as its message
            # (MigrateFailure). A timeout or crash leaves some other message:
            # then only the log group below is printed.
            jq -r "$names"'
              (.errorMessage | try fromjson catch {}) | if type == "object" then . else {} end
              | "Code: \(.code | safe("^[a-z_]+$"))",
                "Stopped on: \(.migrations | names)",
                "Applied before it stopped: \(.applied | names)",
                "Still pending: \(.pending | names)",
                "CloudWatch stream: \(.logStream | safe("^[A-Za-z0-9/_.$#\\[\\]-]+$")) (request \(.requestId | safe("^[A-Za-z0-9-]+$")))"' migrate-result.json
            echo "CloudWatch log group: /aws/lambda/${MIGRATE_FUNCTION_NAME} (the error itself is there; docs/deployment.md § A failed migration)"
            echo "::error::Migrate Lambda failed — API code NOT updated."
            exit 1
          fi
          jq -r "$names"'"Applied: \(.applied | names)", "water_app role: \(.appRole | safe("^(created|updated)$"))"' migrate-result.json

      - name: Update API Lambda code
        env:
          LAMBDA_FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION_NAME" \
            --zip-file "fileb://dist/lambda.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$LAMBDA_FUNCTION_NAME"

      # After the API, like it: the worker runs jobs against the migrated
      # schema. A tick that starts mid-update runs the old code, which the
      # expand/contract rule keeps compatible.
      - name: Update worker Lambda code
        env:
          WORKER_FUNCTION_NAME: ${{ vars.WORKER_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$WORKER_FUNCTION_NAME" \
            --zip-file "fileb://dist/worker.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$WORKER_FUNCTION_NAME"

      # The data feeds' fetcher (no database): after the worker, whose
      # messages it answers. Both sides validate the versioned messages, so a
      # fetch in flight across the update is dropped or retried, never misread.
      - name: Update fetcher Lambda code
        env:
          FETCHER_FUNCTION_NAME: ${{ vars.FETCHER_FUNCTION_NAME }}
        run: |
          set -euo pipefail
          aws lambda update-function-code \
            --function-name "$FETCHER_FUNCTION_NAME" \
            --zip-file "fileb://dist/fetcher.zip" \
            --query 'CodeSha256' --output text
          aws lambda wait function-updated --function-name "$FETCHER_FUNCTION_NAME"

      # The report renderer (infra/reports.tf): push this release's image,
      # tagged <version>-<first 12 hex of the released commit> (the
      # repository's tags are immutable), then move the function to it. The
      # SHA ties the image to the code: a release deleted and recut at the
      # same version on a new commit gets a new tag, so it pushes and deploys
      # its own image instead of finding the old one and skipping the push;
      # a redeploy of the same commit finds its image and reuses it. The
      # function exists only once the operator has set renderer_image_tag and
      # applied (Lambda can't be created before its image exists), so until
      # then this pushes and says what to do.
      - name: Download the renderer image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: renderer-image
          path: dist

      - name: Push the renderer image and update the renderer Lambda
        env:
          RENDERER_FUNCTION_NAME: ${{ vars.RENDERER_FUNCTION_NAME }}
          RENDERER_ECR_REPOSITORY: ${{ vars.RENDERER_ECR_REPOSITORY }}
          VERSION: ${{ needs.preflight.outputs.version }}
          COMMIT_SHA: ${{ needs.preflight.outputs.sha }}
        run: |
          set -euo pipefail
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ && "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::The preflight gave no version or commit SHA to tag the renderer image with."
            exit 1
          fi
          tag="${VERSION}-${COMMIT_SHA:0:12}"
          repo_uri=$(aws ecr describe-repositories --repository-names "$RENDERER_ECR_REPOSITORY" --query 'repositories[0].repositoryUri' --output text)
          registry="${repo_uri%%/*}"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker load < dist/renderer-image.tar.gz
          image="${repo_uri}:${tag}"
          if aws ecr describe-images --repository-name "$RENDERER_ECR_REPOSITORY" --image-ids imageTag="$tag" > /dev/null 2>&1; then
            echo "Image ${tag} is already in ECR (a redeploy of the same commit): not pushing it again."
          else
            docker tag "renderer:${VERSION}" "$image"
            docker push "$image"
          fi
          # Only ResourceNotFoundException means "not created yet". Any other
          # error (AccessDenied after a policy drift, throttling) fails the
          # deploy, rather than leaving the renderer on an old image behind
          # a green run.
          if get_err=$(aws lambda get-function --function-name "$RENDERER_FUNCTION_NAME" 2>&1 >/dev/null); then
            aws lambda update-function-code \
              --function-name "$RENDERER_FUNCTION_NAME" \
              --image-uri "$image" \
              --query 'CodeSha256' --output text
            aws lambda wait function-updated --function-name "$RENDERER_FUNCTION_NAME"
          elif grep -q 'ResourceNotFoundException' <<<"$get_err"; then
            echo "::notice::The renderer Lambda doesn't exist yet. Its image ${tag} is in ECR: set renderer_image_tag = \"${tag}\" in prod.tfvars and apply (docs/deployment.md § Reports)."
          else
            # Its error code only: the text names the deploy role and account.
            code=$(grep -oE 'An error occurred \([A-Za-z]+\)' <<<"$get_err" | head -n 1 || true)
            echo "::error::Could not read the renderer Lambda ${RENDERER_FUNCTION_NAME} (${code:-no AWS error code}, not a ResourceNotFoundException); its image was NOT updated."
            exit 1
          fi

      # Through CloudFront, the same path a browser takes (/api/* is proxied
      # with the shared-secret header; a direct Function URL hit is a 403).
      - name: Smoke check /api/health
        env:
          SITE: ${{ vars.PUBLIC_SITE_URL }}
        run: |
          set -euo pipefail
          body=$(curl -fsS --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 "${SITE%/}/api/health")
          echo "$body"
          if ! jq -e '.ok == true' <<<"$body" > /dev/null; then
            echo "::error::/api/health did not answer {\"ok\":true} after the deploy."
            exit 1
          fi

  attach:
    name: Attach packages to the Release
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets; nothing else
    steps:
      - name: Download packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-lambdas
          path: dist

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mv dist/lambda.zip "dist/backend-${VERSION}-lambda.zip"
          mv dist/migrate.zip "dist/backend-${VERSION}-migrate.zip"
          mv dist/worker.zip "dist/backend-${VERSION}-worker.zip"
          mv dist/fetcher.zip "dist/backend-${VERSION}-fetcher.zip"
          gh release upload "$RELEASE_TAG" dist/*.zip --clobber --repo "$GITHUB_REPOSITORY"
