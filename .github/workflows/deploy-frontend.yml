name: Deploy frontend

## TODO: Uncomment triggers when ready to deploy.
# on:
#   release:
#     types: [published]
#   workflow_dispatch:
on: workflow_dispatch

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Decide whether to deploy frontend
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" \
             || "${GITHUB_EVENT_NAME}" == "repository_dispatch" ]]; then
            echo "Triggered by ${GITHUB_EVENT_NAME} — deploying unconditionally."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CURRENT_TAG="${GITHUB_REF_NAME}"
          echo "Current release tag: $CURRENT_TAG"

          PREV_TAG=$(gh release list --exclude-drafts --limit 10 --json tagName \
            --jq ".[] | select(.tagName != \"$CURRENT_TAG\") | .tagName" \
            | head -n 1 || true)

          if [[ -z "$PREV_TAG" ]]; then
            echo "No previous release found — deploying (first release)."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Previous release tag: $PREV_TAG"
          git fetch --tags --quiet

          CHANGED=$(git diff --name-only "$PREV_TAG..$CURRENT_TAG" -- \
            'frontend/' \
            'packages/engine/' \
            'pnpm-lock.yaml' \
            'infra/scripts/check-csp.mjs' \
            '.github/workflows/deploy-frontend.yml' \
            || true)

          if [[ -n "$CHANGED" ]]; then
            echo "Frontend files changed since $PREV_TAG:"
            echo "$CHANGED" | sed 's/^/  /'
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend files changed between $PREV_TAG and $CURRENT_TAG — skipping deploy."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check
    if: needs.check.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUBLIC_API_URL comes from frontend/.env.production (`/api`, same
      # origin — CloudFront proxies it to the Lambda). Deliberately not
      # overridden from a repo variable here: an unset variable would expand
      # to an empty env var and silently beat the .env.production value.
      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      # The CloudFront CSP header allows inline scripts only because SvelteKit's
      # <meta> CSP narrows them to the hashed bootstrap (infra/security_headers.tf).
      # Refuse to ship a build where that meta policy is missing or incomplete.
      - name: Check the build's CSP hashes
        run: node infra/scripts/check-csp.mjs frontend/build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@d979d5b3a71173a29b74b5b88418bfda9437d885 # v6.1.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-frontend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Only _app/immutable/ is content-hashed, so only it may be cached
      # forever. Everything else (index.html, favicons, site.webmanifest,
      # fonts/) keeps its name across releases and gets a short cache.
      # Immutable assets go up first so a new index.html never points at a
      # chunk that isn't there yet. Old chunks are deliberately NOT deleted
      # (the second sync's --exclude also shields them from its --delete): a
      # tab still running the previous release lazy-loads them on navigation.
      # They are a few MB per release; prune by hand if that ever matters.
      - name: Sync content-hashed assets (cache forever)
        run: |
          aws s3 sync frontend/build/_app/immutable/ "s3://${{ vars.FRONTEND_BUCKET }}/_app/immutable/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync everything else (short cache)
        run: |
          aws s3 sync frontend/build/ "s3://${{ vars.FRONTEND_BUCKET }}/" \
            --delete \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "_app/immutable/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
