name: Deploy frontend

# Release-triggered, estate model (threkir release-web.yml, feohledger
# aws-deploy.yml): publishing a GitHub Release whose tag is `web@X.Y.Z`
# deploys the static SPA to S3 + CloudFront. A bare tag push does nothing.
#
#   gh release create web@0.2.0 --target main --generate-notes
#
# If the release needs a new API, publish the backend@ release first and let
# it finish: the site must never point at an API contract that isn't live yet.
#
# Four jobs, each with only the scope it needs (same shape as
# deploy-backend.yml; its header explains each):
#
#   preflight  tag web@semver + newer than the last web release, commit on
#              main with a green `CI gate`, `production` environment with a
#              required reviewer, every AWS variable/secret set. No AWS.
#   build      pnpm build + the CSP hash check. No AWS.
#   deploy     `environment: production` (required reviewer, then OIDC):
#              S3 sync + CloudFront invalidation.
#   attach     `contents: write` only: attaches the build zip to the Release.
#
# Rollback / redeploy: gh workflow run deploy-frontend.yml -f tag=web@0.1.0

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Published web@X.Y.Z release to deploy (an older tag rolls back)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  preflight:
    name: Preflight (tag, main, CI, environment, AWS config)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'web@')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read # read the production environment's protection rules
      checks: read # read `CI gate` on the tagged commit
    outputs:
      deploy: ${{ steps.preflight.outputs.deploy }}
      sha: ${{ steps.preflight.outputs.sha }}
      version: ${{ steps.preflight.outputs.version }}
    steps:
      - name: Checkout (full history + tags, to check the tag is on main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Release preflight
        id: preflight
        env:
          GH_TOKEN: ${{ github.token }}
          REQUIRED_CONFIG: AWS_DEPLOY_ROLE_ARN,AWS_REGION,FRONTEND_BUCKET,CLOUDFRONT_DISTRIBUTION_ID,PUBLIC_SITE_URL
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          FRONTEND_BUCKET: ${{ vars.FRONTEND_BUCKET }}
          CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
        run: node scripts/release/preflight.mjs web

  build:
    name: Build static site
    needs: preflight
    if: needs.preflight.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout the released commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # No dependency cache in a deploy: a restored cache is written by
          # other runs, and this job ships what it builds with production
          # credentials (CodeQL actions/cache-poisoning). Deploys are rare, so
          # a cold install costs a minute at most.

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # PUBLIC_API_URL comes from frontend/.env.production (`/api`, same
      # origin — CloudFront proxies it to the Lambda). Deliberately not
      # overridden from a repo variable here: an unset variable would expand
      # to an empty env var and silently beat the .env.production value.
      # scripts/guards/check_env_isolation.mjs pins that file to `/api`.
      # SITE_ORIGIN: the prerendered landing page's link-preview tags
      # (og:url, og:image, canonical) need the site's absolute address
      # (frontend/svelte.config.js, kit.prerender.origin). REQUIRED_CONFIG
      # above already refuses a run without PUBLIC_SITE_URL.
      - name: Build frontend
        env:
          SITE_ORIGIN: ${{ vars.PUBLIC_SITE_URL }}
        run: pnpm build:frontend

      # The CloudFront CSP header allows inline scripts only because SvelteKit's
      # <meta> CSP narrows them to the hashed bootstrap (infra/security_headers.tf).
      # Refuse to ship a build where that meta policy is missing or incomplete.
      - name: Check the build's CSP hashes
        run: node infra/scripts/check-csp.mjs frontend/build

      - name: Upload build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-build
          path: frontend/build/
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to S3 + CloudFront
    needs: [preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    permissions:
      contents: read
      id-token: write # OIDC: assume AWS_DEPLOY_ROLE_ARN, no long-lived keys
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: build

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: deploy-frontend-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      # Only _app/immutable/ is content-hashed, so only it may be cached
      # forever. Everything else (index.html, favicons, site.webmanifest,
      # fonts/) keeps its name across releases and gets a short cache.
      # Immutable assets go up first so a new index.html never points at a
      # chunk that isn't there yet. Old chunks are deliberately NOT deleted
      # (the second sync's --exclude also shields them from its --delete): a
      # tab still running the previous release lazy-loads them on navigation.
      # They are a few MB per release; prune by hand if that ever matters.
      - name: Sync content-hashed assets (cache forever)
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync build/_app/immutable/ "s3://${BUCKET}/_app/immutable/" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync everything else (short cache)
        env:
          BUCKET: ${{ vars.FRONTEND_BUCKET }}
        run: |
          aws s3 sync build/ "s3://${BUCKET}/" \
            --delete \
            --cache-control "public, max-age=60, must-revalidate" \
            --exclude "_app/immutable/*"

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*" --query 'Invalidation.Id' --output text

  attach:
    name: Attach build to the Release
    needs: [preflight, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # upload release assets; nothing else
    steps:
      - name: Download build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: frontend-build
          path: build

      - name: Upload to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          zip -qr "web-${VERSION}-build.zip" build
          gh release upload "$RELEASE_TAG" "web-${VERSION}-build.zip" --clobber --repo "$GITHUB_REPOSITORY"
