name: Coverage

# Which code no test reaches (docs/testing.md § Coverage). A report, never a
# gate: no threshold, and it isn't in ci.yml, because v8 coverage costs ~27 %
# more wall clock and the unit and DB jobs are CI's slowest (each ~10 min).
# Weekly, by hand, and on a PR that changes the coverage setup itself. Each
# job writes its table to the run's summary and uploads the HTML reports.
# What it can't see: e2e (Playwright drives a production build, which carries
# no coverage counters), so the frontend's figure is its unit tests alone.
on:
  schedule:
    # 06:30 UTC every Monday, beside the dependency audit (audit.yml).
    - cron: '30 6 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/coverage.yml
      - scripts/coverage-report/**
      - '**/vitest.config.ts'

permissions:
  contents: read

jobs:
  unit:
    name: Unit coverage (engine, backend, frontend)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The frontend's tsconfig extends the generated .svelte-kit one.
      - name: Sync SvelteKit
        run: pnpm -C frontend exec svelte-kit sync

      - name: Unit tests with coverage
        run: pnpm test:coverage

      - name: Summary
        run: node scripts/coverage-report/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-unit
          path: |
            packages/engine/coverage/
            backend/coverage/unit/
            frontend/coverage/
          retention-days: 14

  db:
    name: Backend DB coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The report render tests fail, never skip, under CI without Chromium
      # and MinIO (docs/testing.md § Tests that need a service or a browser):
      # the same browser and store ci.yml's DB job sets up.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./e2e/package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm -C e2e exec playwright install-deps chromium
          else
            pnpm -C e2e exec playwright install --with-deps chromium
          fi

      # Postgres and MinIO from docker-compose.yml, as ci.yml's DB job starts
      # them: pulled by their pinned digests through Google's Docker Hub
      # mirror first (scripts/ci/service-image.sh), never a job `services:`
      # entry, which is always pulled from its own registry. Docker Hub's
      # anonymous limit (issue #492) and ECR Public's ("toomanyrequests: Data
      # limit exceeded", issue #521; this job on #545, run 39218798513) both
      # refused CI's runners. Postgres's first boot runs
      # dev/postgres/00-roles.sql (the app role and the test database), on
      # the local-dev port (:5434). pnpm check:pins (serviceImageProblems)
      # refuses a `services:` image in any workflow.
      - name: Start Postgres and MinIO
        run: |
          for svc in postgres minio; do
            bash scripts/ci/service-image.sh save "$svc" "$RUNNER_TEMP/service-images/$svc.tar"
            bash scripts/ci/service-image.sh load "$svc" "$RUNNER_TEMP/service-images/$svc.tar"
          done
          docker compose -f docker-compose.yml -f "$RUNNER_TEMP/compose.postgres.yml" -f "$RUNNER_TEMP/compose.minio.yml" up -d --wait postgres minio

      - name: DB tests with coverage
        run: pnpm test:backend:db:coverage

      - name: Summary
        run: node scripts/coverage-report/summary.mjs >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-db
          path: backend/coverage/db/
          retention-days: 14
