name: Dependabot auto-merge

# Automatically squash-merges minor + patch Dependabot PRs once CI is
# green, for package ecosystems only (npm, pip, docker-compose, terraform).
# Saves review burden on the grouped weekly bumps.
#
# Never auto-merged, a human reviews them:
#   - major bumps (they have historically needed code changes);
#   - GitHub Actions bumps of any size. An action runs inside the deploy
#     job while it holds the AWS session, so a hijacked patch release
#     (the tj-actions/changed-files pattern) would become the new SHA pin
#     on main unread. The SHA pin only helps if someone reads what it moves to.
#
# Supply-chain delay: `.github/dependabot.yml` sets a 7-day `cooldown` on
# every ecosystem, and `pnpm-workspace.yaml` sets `minimumReleaseAge` to the
# same 7 days, so a version is a week old before it can land here.
#
# Repository setting required: "Allow auto-merge" enabled on
# Settings → General → Pull Requests. Without it `gh pr merge --auto`
# returns an error and the workflow no-ops; PRs sit waiting for a
# human like before, so worst case is degenerate, not destructive.
#
# CI gating: the squash merge waits on the required `CI gate` check
# (ci.yml) before landing. A red CI run keeps the PR queued until a
# human intervenes or the PR is closed.

on:
  pull_request_target:
    branches: [main]

permissions: read-all

jobs:
  auto-merge:
    name: Auto-merge minor + patch
    runs-on: ubuntu-latest
    # The PR's author, not github.actor: the actor is whoever triggered
    # this event, and Dependabot can be the actor of an event on a PR it
    # did not open (a @dependabot rebase of someone else's branch, the
    # "Dependabot confusion" pattern). fetch-metadata below also checks the
    # author and commits, but this gate costs nothing.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      # `pull_request_target` runs in the base-branch context — needs
      # explicit write grants for `gh pr review --approve` and
      # `gh pr merge --auto`. Scoped to this job only so a future
      # job in this workflow doesn't silently inherit them.
      contents: write
      pull-requests: write
    steps:
      - name: Read dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          # Fetch metadata signs the result with the workflow's own
          # GITHUB_TOKEN so a malicious PR can't claim to be a patch
          # bump it isn't.
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # GitHub Actions bumps stay manual whatever their size (header).
      # An allowlist, so it fails closed: fetch-metadata reads the ecosystem
      # from the branch name (dependabot/<ecosystem>/..., `github_actions`
      # for actions), and a name it doesn't list is left for a human.
      # `docker` (the renderer image, .github/dependabot.yml) stays off it
      # too; scripts/guards/check_workflows.mjs (auto-merge) refuses either.
      - name: Approve + auto-merge minor / patch
        if: >-
          contains(fromJSON('["npm_and_yarn", "pip", "docker_compose", "terraform"]'), steps.meta.outputs.package-ecosystem) &&
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          # Best-effort approval. Fails closed (`|| true`) when the
          # repo setting "Allow GitHub Actions to create and approve
          # pull requests" is off — without it, gh pr review --approve
          # returns "GitHub Actions is not permitted to approve pull
          # requests". The workflow still proceeds to queue auto-merge;
          # if branch protection requires approvals the merge sits in
          # the queue until a human approves, which is the desired
          # behaviour for that protection-strict mode.
          gh pr review --approve "$PR_URL" || echo "::notice::PR approval not permitted (enable 'Allow GitHub Actions to create and approve pull requests' in repo settings to enable). Proceeding to queue auto-merge."
          # `--auto --squash` lands the merge as soon as every required
          # check turns green. If branch protection blocks the merge,
          # `--auto` queues it — a human can land it manually after
          # the protection is satisfied.
          gh pr merge --auto --squash "$PR_URL"
