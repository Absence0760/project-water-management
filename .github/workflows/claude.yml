name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# Top-level read-all per Scorecard Token-Permissions guidance — the
# claude job below requests the elevated scopes it actually needs.
# Any future job added to this workflow inherits the read-only
# default unless it explicitly opts into more.
permissions: read-all

jobs:
  claude:
    # Authorisation gate. Both conditions must hold:
    #   1. CLAUDE_AUTHORIZED_USER is set as a repo variable (vars.* is empty
    #      string when unset → comparison fails closed).
    #   2. github.actor matches that variable.
    # If you ever rotate operators, update the variable in
    # Settings → Secrets and variables → Actions → Variables.
    if: |
      vars.CLAUDE_AUTHORIZED_USER != '' &&
      github.actor == vars.CLAUDE_AUTHORIZED_USER && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.assignees.*.login, 'claude')))
      )
    runs-on: ubuntu-latest
    # The three scopes claude-code-action documents (docs/security.md in the
    # action's repo): contents to push its branch, pull-requests and issues
    # to reply. No id-token: the token is passed as github_token below, so
    # the action never mints an OIDC token for its app-token exchange.
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      # Defense in depth — if the if: gate above is ever removed by mistake,
      # this hard-fail prevents the job from progressing past authorisation.
      - name: Verify authorised actor
        env:
          AUTHORISED: ${{ vars.CLAUDE_AUTHORIZED_USER }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -z "$AUTHORISED" ]; then
            echo "::error::CLAUDE_AUTHORIZED_USER repo variable is not set." >&2
            exit 1
          fi
          if [ "$ACTOR" != "$AUTHORISED" ]; then
            echo "::error::Actor '$ACTOR' is not the authorised Claude operator." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The action backs git with its own token (it replaces checkout's
          # credential); nothing else in this job should find one in .git.
          persist-credentials: false

      # The model reads third-party issue and PR text, so assume a prompt
      # injection can steer it. It may write files (Write/Edit) but may not
      # RUN repo code: no pnpm command at all. `pnpm test`/`check`/`build`
      # execute files the model can have just written (a test, a config,
      # svelte.config.js), and `pnpm install` runs lifecycle scripts, so any
      # of them beside Write/Edit is arbitrary code execution with a write
      # token, in the default branch's context where it could also seed the
      # Actions cache. CI tests what it pushes. `Bash(gh *)` would allow
      # `gh release create` (a production deploy), `gh secret set`, `gh
      # workflow run`; `Bash(git *)` would allow `git push --force`. Every
      # Bash command below only reads.
      - name: Run Claude Code
        uses: anthropics/claude-code-action@8ce9314fa9a404564fa7e954cd84f25bcba2b829 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 40 --allowedTools 'Read,Write,Edit,Glob,Grep,Bash(git log:*),Bash(git diff:*),Bash(git status),Bash(git show:*),Bash(git blame:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh run view:*),Bash(gh run list:*)'"
