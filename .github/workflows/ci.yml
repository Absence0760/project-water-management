name: CI

# Always runs on pull_request — no paths-ignore. Docs-only PRs skip the heavy
# jobs via the `changes` job instead, so `CI gate` still reports (templates
# docs/USING.md "The CI gate"; this repo has no ci-gate-docs.yml by design).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Classifies the diff; heavy jobs gate on `code == 'true'`.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: diff
        name: Anything besides docs changed?
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BASE" HEAD | grep -qvE '^(docs/|\.claude/)|\.md$'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Typecheck and unit tests
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Root scripts guard
        run: pnpm test:scripts

      - name: Typecheck all workspaces
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  db-test:
    name: Backend DB tests (Postgres + RLS)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway CI-only credentials, same as docker-compose.yml.
          POSTGRES_USER: water
          POSTGRES_PASSWORD: water
          POSTGRES_DB: water
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U water -d water"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create app role and test database
        env:
          PGPASSWORD: water
        run: psql -h 127.0.0.1 -p 5434 -U water -d water -v ON_ERROR_STOP=1 -f dev/postgres/00-roles.sql

      - name: DB tests
        run: pnpm test:backend:db

  e2e:
    name: End-to-end tests (Playwright)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          # Throwaway CI-only credentials, same as docker-compose.yml.
          POSTGRES_USER: water
          POSTGRES_PASSWORD: water
          POSTGRES_DB: water
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U water -d water"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C e2e exec playwright install --with-deps chromium

      - name: Create app role
        env:
          PGPASSWORD: water
        run: psql -h 127.0.0.1 -p 5434 -U water -d water -v ON_ERROR_STOP=1 -f dev/postgres/00-roles.sql

      # Global setup creates + migrates water_e2e; Playwright starts the
      # backend (:3101) and frontend (:7801) itself.
      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          retention-days: 7

  # Single required status check for branch protection (docs/USING.md
  # "The CI gate"). It fans in on every job above via `needs` + always(),
  # failing the merge if any upstream job did not succeed (a skipped job
  # counts as passing, matching GitHub's required-check semantics).
  #
  # Add each new job's id to `needs` below — that is the only edit needed
  # to gate merges on it; the branch-protection config never changes.
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, test, db-test, e2e]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
