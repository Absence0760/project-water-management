name: CI

## TODO: Uncomment triggers when ready. Keep `paths-ignore` as the exact
## inverse of ci-gate-docs.yml's `paths` so the required "CI gate" check
## is always reported (see docs/USING.md "The CI gate"). Re-run
## new-project-account.sh once this is live to wire CI gate in as the
## required status check on main.
# on:
#   pull_request:
#     branches: [main]
#     paths-ignore:
#       - 'docs/**'
#       - '**/*.md'
#       - '.claude/**'
#   push:
#     branches: [main, dev]
#   workflow_dispatch:
on: workflow_dispatch

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Seed frontend .env for typecheck
        run: cp frontend/.env.example frontend/.env

      - name: Typecheck all workspaces
        run: pnpm check

      - name: Run tests
        run: pnpm test

  # Single required status check for branch protection (docs/USING.md
  # "The CI gate"). It fans in on every job above via `needs` + always(),
  # failing the merge if any upstream job did not succeed (a skipped job
  # counts as passing, matching GitHub's required-check semantics).
  #
  # Add each new job's id to `needs` below — that is the only edit needed
  # to gate merges on it; the branch-protection config never changes.
  # Pair with ci-gate-docs.yml (base-owned) so docs-only PRs still report
  # a passing "CI gate".
  ci-gate:
    name: CI gate
    runs-on: ubuntu-latest
    if: always()
    needs: [test]
    steps:
      - name: Require every upstream job to have passed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS_JSON"
          bad=$(echo "$NEEDS_JSON" | jq -r \
            'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key)=\(.value.result)"')
          if [ -n "$bad" ]; then
            echo "::error::CI gate failing — upstream jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "All upstream jobs passed."
