name: Load a reference dataset

# Loads one of the catchment map's reference datasets into the production
# database (docs/deployment.md § Reference datasets). The database is in a
# private VPC, so the load runs in the migrate Lambda, which already holds the
# schema owner's credentials: it reads the one file the operator uploaded to
# the private reference bucket (infra/map_data.tf), checks it hashes to the
# SHA-256 given here, and replaces that dataset (backend/src/geo/referenceLoad.ts).
#
# Only the kinds docs/maps.md § Sources marks allowed load: land-cover (ESA
# WorldCover) and rivers (HydroRIVERS, once HydroSHEDS' Exhibit B statement is
# in the app's legal text). Quaternaries, the register of dams and the gauging
# stations stay blocked by their licences; the input offers only the allowed
# kinds, the check job refuses the rest, and so does the Lambda.
#
# Two jobs, as in the deploy workflows:
#   check  no AWS: the inputs' shapes and the licence gates
#          (scripts/release/map-data-gates.mjs load), before anyone approves.
#   load   `environment: production` (a required reviewer, then OIDC: the
#          deploy role's trust policy pins that environment): invokes the
#          migrate Lambda with { load: … } and prints counts only. The log is
#          public (the repo is); the Lambda's detail stays in CloudWatch.
#
# Prepare and upload first (docs/deployment.md § Reference datasets):
#   pnpm import:land-cover tiles/*.tif --dataset WorldCover-2021-v200 --out worldcover.json.gz
#   sha256sum worldcover.json.gz
#   aws s3 cp worldcover.json.gz s3://<reference_bucket>/reference/land-cover/worldcover-2021.json.gz
# then run:
#   gh workflow run load-reference.yml -f kind=land-cover -f key=reference/land-cover/worldcover-2021.json.gz -f sha256=<hex> -f dataset=WorldCover-2021-v200

on:
  workflow_dispatch:
    inputs:
      kind:
        description: 'What to load (only the kinds docs/maps.md § Sources allows)'
        required: true
        type: choice
        options:
          - land-cover
          - rivers
      key:
        description: 'Object key in the reference bucket: reference/<kind>/<file>'
        required: true
        type: string
      sha256:
        description: 'SHA-256 of the uploaded file (sha256sum), 64 lowercase hex digits'
        required: true
        type: string
      dataset:
        description: 'Dataset label to load as (replaces that dataset), e.g. WorldCover-2021-v200'
        required: true
        type: string
      source:
        description: 'Rivers: the attribution stored on every reach (required). Land cover: overrides the file’s own'
        required: false
        type: string
        default: ''
      min_order:
        description: 'Rivers: leave out reaches below this Strahler order (1 keeps every reach)'
        required: false
        type: string
        default: '1'

permissions:
  contents: read

concurrency:
  group: load-reference
  cancel-in-progress: false

jobs:
  check:
    name: Check the inputs and the licence gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      # Inputs reach the script through the environment, never the shell's text.
      - name: Inputs and licence gates
        env:
          LOAD_KIND: ${{ inputs.kind }}
          LOAD_KEY: ${{ inputs.key }}
          LOAD_SHA256: ${{ inputs.sha256 }}
          LOAD_DATASET: ${{ inputs.dataset }}
          LOAD_SOURCE: ${{ inputs.source }}
          LOAD_MIN_ORDER: ${{ inputs.min_order }}
        run: node scripts/release/map-data-gates.mjs load

  load:
    name: Load (migrate Lambda)
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: ${{ vars.PUBLIC_SITE_URL }}
    permissions:
      contents: read
      id-token: write # OIDC: assume AWS_DEPLOY_ROLE_ARN, no long-lived keys
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: load-reference-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Invoke the migrate Lambda with the load
        env:
          MIGRATE_FUNCTION_NAME: ${{ vars.MIGRATE_FUNCTION_NAME }}
          LOAD_KIND: ${{ inputs.kind }}
          LOAD_KEY: ${{ inputs.key }}
          LOAD_SHA256: ${{ inputs.sha256 }}
          LOAD_DATASET: ${{ inputs.dataset }}
          LOAD_SOURCE: ${{ inputs.source }}
          LOAD_MIN_ORDER: ${{ inputs.min_order }}
        run: |
          set -euo pipefail
          [ -n "$MIGRATE_FUNCTION_NAME" ] || { echo "::error::The MIGRATE_FUNCTION_NAME variable is not set (docs/deployment.md § GitHub configuration)."; exit 1; }
          # The payload is built by jq from the environment: no input is ever
          # spliced into JSON or shell text.
          jq -n '{load: {kind: env.LOAD_KIND, key: env.LOAD_KEY, sha256: env.LOAD_SHA256, dataset: env.LOAD_DATASET,
            source: (env.LOAD_SOURCE | if . == "" then null else . end), minOrder: (env.LOAD_MIN_ORDER | tonumber)}}' > payload.json
          # Synchronous; the function's timeout is 900 s. No --log-type Tail:
          # this log is public, and the function's log can quote the file.
          aws lambda invoke \
            --function-name "$MIGRATE_FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload fileb://payload.json \
            --cli-read-timeout 920 \
            load-result.json > load-meta.json
          # Each field is checked against the shape it must have and dropped
          # if it doesn't match, so nothing but what lambda-migrate.ts means to
          # report can print.
          defs='def safe(re): if type == "string" and test(re) then . else "unknown" end;
            def count: if type == "number" and . >= 0 and . == floor then tostring else "unknown" end;'
          if jq -e 'has("FunctionError")' load-meta.json > /dev/null; then
            # lambda-migrate.ts fails with a JSON summary as its message
            # (LoadFailure). A timeout or crash leaves some other message:
            # then only the log group below is printed.
            jq -r "$defs"'
              (.errorMessage | try fromjson catch {}) | if type == "object" then . else {} end
              | "Code: \(.code | safe("^[a-z_]+$"))",
                "Reason: \(.reason | safe("^[A-Za-z0-9 ,.:;()/<>§’–\\x27\"_-]+$"))",
                "CloudWatch stream: \(.logStream | safe("^[A-Za-z0-9/_.$#\\[\\]-]+$")) (request \(.requestId | safe("^[A-Za-z0-9-]+$")))"' load-result.json
            echo "CloudWatch log group: /aws/lambda/${MIGRATE_FUNCTION_NAME} (the detail is there; docs/deployment.md § Reference datasets)"
            echo "::error::The load failed; the dataset is as it was."
            exit 1
          fi
          jq -r "$defs"'"Loaded \(.written | count) row(s) of \(.kind | safe("^(land-cover|rivers)$")) as dataset \(.dataset | safe("^[A-Za-z0-9][A-Za-z0-9 ._-]{0,49}$"))",
            "Skipped (reasons in CloudWatch): \(.skipped | count)", "Below the Strahler order: \(.belowOrder | count)"' load-result.json
