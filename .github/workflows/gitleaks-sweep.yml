name: gitleaks weekly sweep

# The weekly FULL-HISTORY secret scan, and the thing that says so when it
# fails (estate standard: threkir's gitleaks-sweep.yml).
#
# The push / PR scan (ci.yml `gitleaks`) reads the commits in each event. This
# cron is the only scan that reads all of main's history, which is what
# catches a secret that landed on a forgotten branch and was merged later. It
# runs on no PR and feeds no `CI gate`, so a failing sweep would otherwise
# reach nobody: the `report` job opens (or updates) a `secret-scan` issue,
# and closes it on the next clean sweep.

on:
  schedule:
    # 06:00 UTC Monday, the same weekly tide as audit.yml and scorecard.yml.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    name: Full-history secret scan
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/gitleaks.yml

  report:
    name: Surface a failed weekly sweep
    needs: sweep
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the tracking issue
        if: needs.sweep.result != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create secret-scan --repo "$REPO" \
            --color B60205 \
            --description "Findings from the weekly full-history gitleaks sweep" \
            2>/dev/null || true

          {
            echo "The weekly full-history \`gitleaks\` sweep did not pass."
            echo ""
            echo "- Run: $RUN_URL"
            echo "- Scope: the whole of \`main\`'s history, which no other scan reads."
            echo ""
            echo "**Findings are deliberately not quoted here.** Open the run above to see them."
            echo ""
            echo "If a finding is real: rotate the credential FIRST (docs/security.md § Incident playbook), then purge it from history."
            echo "If it is a false positive: add it to \`.gitleaks.toml\`, scoped to the matched"
            echo "value rather than the file, so a genuine key in the same file still fails."
            echo ""
            echo "This issue closes itself on the next clean sweep."
          } > body.md

          existing=$(gh issue list --repo "$REPO" --state open \
            --label secret-scan --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body-file body.md
            gh issue comment "$existing" --repo "$REPO" \
              --body "Still failing as of $(date -u +%Y-%m-%d). Run: $RUN_URL"
          else
            gh issue create --repo "$REPO" \
              --title "Weekly secret scan is failing" \
              --body-file body.md \
              --label secret-scan
          fi

      - name: Close the tracking issue on a clean sweep
        if: needs.sweep.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh issue list --repo "$REPO" --state open \
            --label secret-scan --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --repo "$REPO" \
              --comment "Sweep clean as of $(date -u +%Y-%m-%d) — closing automatically."
          fi
